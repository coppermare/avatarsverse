name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate avatar manifest
        run: npm run generate-avatars

      - name: Verify generated files are current
        run: git diff --exit-code -- avatars/avatars.json avatar-manifest.ts

      - name: Check project
        run: npm run check
